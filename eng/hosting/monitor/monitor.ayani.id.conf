# Public listeners serve ACME challenges and deny application access.
server {
    listen 80;
    listen [::]:80;
    server_name monitor.ayani.id;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/oto-monitor-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name monitor.ayani.id;
    ssl_certificate /etc/letsencrypt/live/monitor.ayani.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.ayani.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    return 404;
}
# This listener is reachable only from the VPS or an authenticated SSH tunnel.
server {
    listen 127.0.0.1:5443 ssl;
    server_name monitor.ayani.id;
    ssl_certificate /etc/letsencrypt/live/monitor.ayani.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.ayani.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    location / {
        proxy_pass http://127.0.0.1:5091;
        proxy_set_header Host monitor.ayani.id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
        proxy_buffering off;
    }
}
