# Candidate for the existing oto.ayani.id site; retains its Certbot configuration.
server {
    server_name oto.ayani.id;
    access_log /var/log/nginx/oto.ayani.id.access.log;
    error_log /var/log/nginx/oto.ayani.id.error.log;
    location / {
        proxy_pass http://127.0.0.1:5088;
        proxy_http_version 1.1;
        proxy_set_header Host oto.ayani.id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/oto.ayani.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oto.ayani.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = oto.ayani.id) { return 301 https://$host$request_uri; }
    listen 80;
    listen [::]:80;
    server_name oto.ayani.id;
    return 404;
}
