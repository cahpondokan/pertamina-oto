<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk · Monitor OTO</title><link rel="stylesheet" href="/assets/monitor.css"></head>
<body class="login-page"><main class="login-card"><div class="brand"><span class="brand-icon">O</span><div>OTO <small>MONITOR PENGELOLA</small></div></div><span class="badge">Akses privat · SSH</span><h1>Pantau OTO<br>dengan tenang.</h1><p class="muted">Masuk untuk melihat aktivitas aplikasi dan menelusuri gangguan teknis.</p><form method="post" action="/login"><input type="hidden" name="csrf" value="{{csrf}}"><label for="username">Nama pengelola</label><input id="username" name="username" autocomplete="username" required maxlength="40" autofocus><label for="password">Kata sandi</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><p class="form-error" role="alert">{{message}}</p><button class="primary" type="submit">Masuk ke dashboard <span>→</span></button></form><p class="login-note">Khusus pengelola. Sesi berlaku selama 2 jam.<br>Lupa kata sandi? Atur ulang melalui administrator VPS.</p><footer>PDF pengguna tetap berada di perangkatnya.</footer></main></body></html>
